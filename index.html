function npcTrustTitle(value){let n=Math.max(0,Number(value)||0);return n>=8?'Trusted Friend':n>=5?'Close Companion':n>=3?'Familiar Face':n>=1?'Recognizes You':'Stranger'}
function npc(){let raw=Number(state.flags.npcScene)||0,idx=((raw%npcLines.length)+npcLines.length)%npcLines.length,scene=npcLines[idx],who=npcRelationName(idx),memory=state.relationshipMemories[who]||{talks:0,last:'No conversations yet.'},trust=Math.max(0,Number(state.relationships[who])||0),lastResult=typeof state.flags.npcResult==='string'?state.flags.npcResult:'',lastPerson=typeof state.flags.npcLastPerson==='string'?state.flags.npcLastPerson:'',lastChoice=typeof state.flags.npcLastChoice==='string'?state.flags.npcLastChoice:'';return '<div class="pagehead"><div class="eyebrow">GAMING DISTRICT / LIFE SIMULATOR</div><h1>NPC Life</h1><p class="muted">Day '+state.day+' · '+escapeHTML(state.location)+' · Job: '+escapeHTML(state.job)+'</p></div><div class="layout"><section class="box"><div style="font-size:46px">🧍‍♂️　🧙</div><div class="tag">RANDOM ENCOUNTER</div><h2>'+scene[0]+'</h2><p>'+scene[1]+'</p><h3>Choose your dialogue</h3>'+scene[2].map((x,i)=>'<button class="choice" data-dialog="'+i+'">'+(i+1)+'. '+escapeHTML(x)+'</button>').join('')+(lastResult?'<div class="notice" role="status"><b>Last conversation · '+escapeHTML(lastPerson||'A local resident')+'</b><br>“'+escapeHTML(lastResult)+'”'+(lastChoice?'<br><span class="muted">You said: '+escapeHTML(lastChoice)+'</span>':'')+(lastPerson?'<br><b>Trust change:</b> '+((Number(state.flags.npcTrustChange)||0)>0?'+':'')+(Number(state.flags.npcTrustChange)||0):'')+'</div>':'')+'<div class="memory"><b>🧠 '+escapeHTML(who)+' remembers you</b><br>'+memory.talks+' previous conversations · Last choice: '+escapeHTML(memory.last||'Not met yet')+'<br><b>Relationship:</b> '+npcTrustTitle(trust)+' · '+trust+' trust</div><button class="btn" data-random-encounter>🎲 Find a random encounter</button><div class="actions"><button class="btn" data-action="work">Do a questionable shift (+12 NC)</button><button class="btn" data-action="sleep">Go home / next day</button></div></section><aside class="box"><h3>📋 NPC status</h3><p>Mood</p><div class="bar"><span style="width:'+state.mood+'%"></span></div><p>Reputation: <b>'+state.reputation+'</b></p><p>Coins: <b>'+state.coins+' NC</b></p><p>Inventory</p><ul>'+state.inventory.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul><div class="notice">Local prophecy: You are not the chosen one. You are barely the backup one.</div><p><b>Current relationship:</b> '+escapeHTML(who)+' · '+trust+' trust</p><button class="btn" data-clue="guard-ledger">Ask about the missing crumb</button></aside></div>'}
function npcChoice(i){let idx=(Number(state.flags.npcScene)||0)%npcLines.length;let scene=npcLines[idx];if(!Number.isInteger(i)||i<0||i>=scene[2].length)return;let result=scene[3][i];let reward=[2,1,0,15,0][i];if(idx===1)reward=[0,-2,8,0,0][i];if(idx===2)reward=[0,0,2,0,10][i];state.coins=Math.max(0,state.coins+reward);state.xp+=8;state.stats.conversations++;let person=npcRelationName(idx);let trustChange=[[0,0,1,2,0],[2,-1,1,-1,0],[1,1,1,0,2]][idx]?.[i]??0;let previousTrust=Math.max(0,Number(state.relationships[person])||0);state.relationships[person]=Math.max(0,previousTrust+trustChange);state.flags.npcTrustChange=state.relationships[person]-previousTrust;state.relationshipMemories[person]=state.relationshipMemories[person]||{talks:0,last:''};state.relationshipMemories[person].talks++;state.relationshipMemories[person].last=scene[2][i];state.flags.npcLastPerson=person;state.flags.npcLastChoice=scene[2][i];if(person==='Gate Guard Greg'&&state.relationships[person]>=2&&!state.unlocks.moonforum){state.unlocks.moonforum=true;toast('Secret website unlocked: Moon Forum!')}state.reputation+=i===3?1:0;state.mood=Math.max(5,Math.min(100,state.mood+(i===4?-3:2)));state.flags.npcScene=idx+1;state.flags.npcResult=result;save();award('First Conversation');render()}
function pigeon(){let posts=state.posts.length?state.posts.map((p,i)=>({...p,id:'saved-'+i})): [{id:'sample-mayor',by:'Mayor Pigeon',txt:'URGENT: Bread prices are up 400%. This is a dark day for beak-kind.',likes:12},{id:'sample-rat',by:'DefinitelyNotARat',txt:'Hello fellow pigeons. I enjoy seeds and definitely do not operate a cheese-based intelligence network.',likes:4},{id:'sample-bread',by:'BreadEnjoyer99',txt:'just dropped a crumb. biggest day of my life.',likes:28}];return '<div class="pagehead"><div class="eyebrow">SOCIAL DISTRICT</div><h1>🐦 PigeonBook</h1><p class="muted">Connect. Squawk. Demand bread.</p></div><div class="layout"><section class="box"><h2>Public flock feed</h2><label for="postText">Broadcast a thought to the flock</label><textarea id="postText" class="field" rows="3" maxlength="180" placeholder="The bread economy is collapsing..."></textarea><button class="btn primary" data-action="post">Publish squawk</button>'+posts.slice().reverse().map(p=>{let liked=!!state.pigeonLikes[p.id],count=(Number(p.likes)||0)+(liked?1:0);return '<div class="feeditem"><strong>🐦 '+escapeHTML(p.by)+'</strong><p>'+escapeHTML(p.txt)+'</p><button class="btn like-btn" type="button" data-pigeon-like="'+p.id+'" aria-pressed="'+liked+'">'+(liked?'♥ Liked':'♡ Like')+' · '+count+'</button><span class="muted"> crumbs of approval</span></div>'}).join('')+'</section><aside class="box"><h3>Flock trends</h3><p>#BreadGate</p><p>#SuspiciousHumans</p><p>#PigeonInflation</p><div class="notice">This is a fictional local feed. Your posts stay in this browser.</div><button class="btn" data-clue="pigeon-crumb">Investigate the mayor’s pinned crumb report</button></aside></div>'}

function world(){let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];let claimed=state.flags.eventClaimedDay===state.day;return '<div class="pagehead"><div class="eyebrow">THE SHARED UNIVERSE</div><h1>🌐 World Hub</h1><p class="muted">One world state connects the websites, characters, currency and your adventures.</p></div><div class="layout"><section class="box"><div class="tag">TODAY\'S WORLD EVENT · DAY '+state.day+'</div><h2>'+event.icon+' '+event.title+'</h2><p>'+event.desc+'</p><button class="btn primary" data-world-event '+(claimed?'disabled':'')+'>'+(claimed?'Event reward collected':'Investigate event')+'</button><p class="muted">'+(claimed?'You already investigated today. Sleep in NPC Life to advance the day.':'One event reward is available per in-game day.')+'</p></section><aside class="box"><h3>🗺️ World status</h3><p>Destinations visited: <b>'+state.stats.sitesVisited.length+'</b></p><p>NPC conversations: <b>'+state.stats.conversations+'</b></p><p>Public squawks: <b>'+state.stats.posts+'</b></p><p>Permits collected: <b>'+state.stats.permits+'</b></p><p>Work shifts: <b>'+state.stats.workShifts+'</b></p><button class="btn" data-go="quests">Open quest board →</button></aside></div><div class="sectionhead"><h2>People you may encounter</h2></div><div class="grid">'+[['🧙','The Lost Hero','Needs directions. Has no map.'],['🥖','Martha the Baker','Runs the village bakery and pays badly.'],['🛡️','Gate Guard Greg','Protects the road from suspicious potatoes.'],['🐦','Mayor Pigeon','Elected by a landslide of crumbs.']].map(n=>'<article class="card"><div class="emoji">'+n[0]+'</div><h3>'+n[1]+'</h3><p>'+n[2]+'</p></article>').join('')+'</div><div class="sectionhead"><h2>Shared world rules</h2></div><div class="box"><p>Coins, XP, inventory, achievements, NPC encounters, social posts, permits and quest progress all belong to the same local player save. This is a single-player simulated world; it does not create real online multiplayer or cross-device sync. function randomPortal(){let routes=['npc','pigeon','ministry','browser','story','shop','bazaar','arcade','world'];let route=routes[Math.floor(Math.random()*routes.length)];let out=$('#rouletteResult');if(out)out.textContent='The universe selected: '+route.toUpperCase();if(portalTimer)clearTimeout(portalTimer);portalTimer=setTimeout(()=>{portalTimer=null;go(route)},450);}

forEach(b=>b.onclick=()=>sellItem(Number(b.dataset.sellIndex)));$('#app').querySelectorAll('[data-character-claim]').forEach(b=>b.onclick=()=>claimCharacterJob(b.dataset.characterClaim));$('#app').querySelectorAll('[data-world-event]').forEach(b=>b.onclick=claimWorldEvent);$('#app').querySelectorAll('[data-map-go]').forEach(b=>b.onclick=()=>go(b.dataset.mapGo));$('#app').querySelectorAll('[data-hidden-find]').forEach(b=>b.onclick=()=>findHidden(b.dataset.hiddenFind));$('#app').querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>adoptPet(b.dataset.adopt));$('#app').querySelectorAll('[data-pet-active]').forEach(b=>b.onclick=()=>{state.petActive=b.dataset.petActive;save();render()});$('#app').querySelectorAll('[data-pet-name]').forEach(b=>b.onclick=()=>renamePet(b.dataset.petName));$('#app').querySelectorAll('[data-pet-play]').forEach(b=>b.onclick=()=>playWithPet(b.dataset.petPlay));$('#app').querySelectorAll('[data-random-encounter]').forEach(b=>b.onclick=randomEncounter);$('#app').querySelectorAll('[data-tournament-start]').forEach(b=>b.onclick=startCup);$('#app').querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>collectClue(b.dataset.clue));$('#app').querySelectorAll('[data-chaos]').forEach(b=>b.onclick=chaos);$('#app').querySelectorAll('[data-random-portal]').forEach(b=>b.onclick=randomPortal);const start=$('#gameStart');if(start)start.onclick=startCrumbGame;const search=$('#portalSearch');if(search)search.oninput=()=>{let q=search.value.toLowerCase(),cards=[...$('#districtGrid').querySelectorAll('.card')],shown=0;cards.forEach(c=>{let match=c.textContent.toLowerCase().includes(q);c.classList.toggle('hidden',!match);if(match)shown++});$('#portalCount').textContent=shown+' matching portals';if(!shown&&!$('#districtGrid .portal-empty'))$('#districtGrid').insertAdjacentHTML('beforeend','<div class="portal-empty">No portals found. The pigeons ate that result.</div>');else if(shown){let empty=$('#districtGrid .portal-empty');if(empty)empty.remove()}};}
function action(a){if(a==='work'){state.stats.workShifts++;earn(12,10);toast('Shift complete. You earned 12 NC.');render()}if(a==='sleep'){state.day++;state.mood=Math.min(100,state.mood+15);state.location='Village Square';save();toast('A new day begins. Nothing has changed.');render()}if(a==='post'){let txt=$('#postText').value.trim();if(!txt)return toast('You cannot publish an empty squawk.');state.posts.push({by:state.name,txt,likes:0});state.stats.posts++;earn(1,2);award('First Public Squawk');render();toast('Your squawk has entered the ecosystem.')}if(a==='rename'){let n=$('#nameInput').value.trim();if(!n)return toast('A name is required.');state.name=n;save();render();toast('Identity updated. The government is confused.')}if(a==='read-manifesto'){let p=$('#manifestoResult');if(p){p.textContent='The manifesto says: “The crumb opens the door. The recipe opens the moon.” A second website may be hidden among the stars.';p.classList.remove('hidden')}state.storyStage=Math.max(state.storyStage,1);state.xp+=12;award('Read the Forbidden Manifesto');save()}if(a==='backup'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='unhinged-internet-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='reset'){if(confirm('Reset all local universe progress? Export a backup first if you want to keep it.')){localStorage.removeItem('unhinged-save');state={...defaults,flags:{},stats:{conversations:0,posts:0,permits:0,workShifts:0,sitesVisited:[]},relationships:{},relationshipMemories:{},pets:[],petActive:'',hiddenFinds:[],arcadeWins:0,tournamentBest:0,encounterCount:0,clues:[],unlocks:{},storyStage:0,claimedQuests:[],characterQuests:[],tradeCompleted:0};save();go('home')}}}
function permit(id){let labels={identity:'NPC Identity Card',potato:'Potato Ownership Permit',sock:'Missing Sock Investigation',stand:'Standing Around License'};if(state.coins<5){$('#permitResult').textContent='APPLICATION REJECTED: insufficient nonsense coins.';return}state.coins-=5;state.inventory.push(labels[id]);state.stats.permits++;state.xp+=5;save();$('#permitResult').textContent='APPROVED: '+labels[id]+' issued. Please display it to absolutely nobody.';award('Licensed Citizen')}
function fakeSite(site){let copy={portal:'<h2>Welcome to my homepage!!!</h2><p>✨ Visitor '+(100+state.xp)+' ✨</p><p>UNDER CONSTRUCTION. Always.</p>',webring:'<h2>THE POTATO WEBRING</h2><p>Previous site ← You are here → Next site</p><p>Only 3 websites are in this webring. One is missing.</p>',conspiracy:'<h2>THE MOON IS A POTATO?</h2><p>Evidence: it is round. Potatoes are round. Wake up, villagers.</p><p>Last updated: 03/14/1999</p>',guestbook:'<h2>GUESTBOOK</h2><p>“Cool page!!!” — Anonymous</p><p>“Please stop emailing me.” — Webmaster</p><p>“I was here.” — You, probably</p>'};$('#fakeSite').innerHTML=copy[site]||copy.portal;earn(0,1)}
