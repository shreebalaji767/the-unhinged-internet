/* Responsive layout hardening: phones, tablets, laptops, ultrawide and touch screens */
html{width:100%;min-width:0;overflow-x:hidden;scroll-padding-top:110px}

.shell{width:min(100%,1440px);padding:clamp(8px,2vw,20px)}

button,.btn,.nav button,.choice,.maptile{touch-action:manipulation}
button,.btn{min-height:42px}
.card,.box,.feeditem,.chip,.game-stat{overflow-wrap:anywhere}

.hero{padding:clamp(20px,4vw,42px) clamp(14px,3vw,28px)}

function worldEventRequirement(event){if(event.title==='Pigeon Parade')return {label:'Publish at least one PigeonBook squawk',ready:state.stats.posts>=1};if(event.title==='Potato Appreciation Day')return {label:'Collect at least one Ministry permit',ready:state.stats.permits>=1};if(event.title==='Suspiciously Productive Tuesday')return {label:'Complete at least one work shift',ready:state.stats.workShifts>=1};if(event.title==='Retro Web Revival')return {label:'Visit Fake Internet 1999',ready:state.stats.sitesVisited.includes('browser')};return {label:'Investigate the event',ready:true}}
function world(){let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];let claimed=state.flags.eventClaimedDay===state.day,requirement=worldEventRequirement(event),ready=requirement.ready;return '<div class="pagehead"><div class="eyebrow">THE SHARED UNIVERSE</div><h1>🌐 World Hub</h1><p class="muted">One world state connects the websites, characters, currency and your adventures.</p></div><div class="layout"><section class="box"><div class="tag">TODAY\'S WORLD EVENT · DAY '+state.day+'</div><h2>'+event.icon+' '+event.title+'</h2><p>'+event.desc+'</p><p class="notice">Event objective: '+requirement.label+' · '+(ready?'✓ Complete':'Not complete yet')+'</p><button class="btn primary" data-world-event '+(claimed||!ready?'disabled':'')+'>'+(claimed?'Event reward collected':ready?'Collect event reward':'Complete objective first')+'</button><p class="muted">'+(claimed?'You already investigated today. Sleep in NPC Life to advance the day.':ready?'Objective complete. Collect your one daily reward.':'Your existing activity progress counts; complete the objective, then return here.')+'</p></section><aside class="box"><h3>🗺️ World status</h3><p>Destinations visited: <b>'+state.stats.sitesVisited.length+'</b></p><p>NPC conversations: <b>'+state.stats.conversations+'</b></p><p>Public squawks: <b>'+state.stats.posts+'</b></p><p>Permits collected: <b>'+state.stats.permits+'</b></p><p>Work shifts: <b>'+state.stats.workShifts+'</b></p><button class="btn" data-go="quests">Open quest board →</button></aside></div><div class="sectionhead"><h2>People you may encounter</h2></div><div class="grid">'+[['🧙','The Lost Hero','Needs directions. Has no map.'],['🥖','Martha the Baker','Runs the village bakery and pays badly.'],['🛡️','Gate Guard Greg','Protects the road from suspicious potatoes.'],['🐦','Mayor Pigeon','Elected by a landslide of crumbs.']].map(n=>'<article class="card"><div class="emoji">'+n[0]+'</div><h3>'+n[1]+'</h3><p>'+n[2]+'</p></article>').join('')+'</div><div class="sectionhead"><h2>Shared world rules</h2></div><div class="box"><p>Coins, XP, inventory, achievements, NPC encounters, social posts, permits and quest progress all belong to the same local player save. This is a single-player simulated world; it does not create real online multiplayer or cross-device sync.</p></div>'}
function claimQuest(id){let q=questDefs.find(x=>x.id===id);if(!q||state.claimedQuests.includes(id)||!Number.isFinite(q.target)||!Number.isFinite(q.reward)||!Number.isFinite(q.xp)||questProgress(q)<q.target)return toast('Quest is not ready to claim.');state.claimedQuests.push(id);state.coins+=q.reward;state.xp+=q.xp;award('Quest: '+q.title);save();toast('Quest reward collected!');render()}
function claimWorldEvent(){if(state.flags.eventClaimedDay===state.day)return toast('Today’s world event is already complete.');let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];if(!event||typeof event.item!=='string'||!event.item)return toast('This world event is unavailable.');let requirement=worldEventRequirement(event);if(!requirement.ready)return toast('Complete the event objective first: '+requirement.label+'.');state.flags.eventClaimedDay=state.day;state.coins+=10;state.xp+=10;state.inventory.push(event.item);save();award('World Event Explorer');toast('Event reward: '+event.item);render()}

const petOptions=[{id:'cat',name:'Crumb Cat',emoji:'🐈',cost:35},{id:'pigeon',name:'Pocket Pigeon',emoji:'🐦',cost:50},{id:'dragon',name:'Potato Dragon',emoji:'🐉',cost:85},{id:'sock',name:'Ghost Sock',emoji:'🧦',cost:60}];

function pets(){let bonds=state.petBonds||{},played=state.petPlayDay||{};return '<div class="pagehead"><div class="eyebrow">COMPANION MANAGEMENT</div><h1>🐾 Questionable Pets</h1><p class="muted">Adopt a tiny friend. Your companions are saved locally.</p></div><div class="grid">'+petOptions.map(p=>'<article class="card"><div class="pet">'+p.emoji+'</div><h3>'+p.name+'</h3><p>Small friend. Large chaos.</p><b>'+p.cost+' NC</b><button class="btn primary" data-adopt="'+p.id+'" '+(state.pets.some(x=>x.id===p.id)||state.coins<p.cost?'disabled':'')+'>'+(state.pets.some(x=>x.id===p.id)?'Adopted':'Adopt')+'</button></article>').join('')+'</div><div class="sectionhead"><h2>Your companions</h2><span class="muted">'+state.pets.length+' / '+petOptions.length+' adopted</span></div><div class="grid">'+(state.pets.length?state.pets.map(p=>{let bond=bonds[p.id]||0,done=played[p.id]===state.day,reaction=state.petLastReaction[p.id]||'';return '<article class="card pet-card '+(state.petActive===p.id?'is-active':'')+'"><div class="pet">'+p.emoji+'</div><h3>'+escapeHTML(p.name)+'</h3><p>'+escapeHTML(p.nickname||p.name)+'</p><p class="muted">'+petPersonality(p.id)+'</p><p>🤝 Bond: <b>'+bond+'</b> · '+(bond>=5?'Best buddies':bond>=2?'Getting close':'New friends')+'</p>'+(reaction?'<div class="notice" role="status">'+escapeHTML(reaction)+'</div>':'')+'<button class="btn" data-pet-play="'+p.id+'" '+(done?'disabled':'')+'>'+(done?'✓ Played today':'🎾 Play together (+3 XP)')+'</button><button class="btn '+(state.petActive===p.id?'primary':'')+'" data-pet-active="'+p.id+'" aria-pressed="'+(state.petActive===p.id)+'">'+(state.petActive===p.id?'✓ Following you':'Choose companion')+'</button><button class="btn" data-pet-name="'+p.id+'">Rename</button></article>'}).join(''):'<div class="portal-empty">No companions yet. The adoption desk is waiting.</div>')+'</div>'}

function renamePet(id){let p=state.pets.find(x=>x.id===id);if(!p)return;let n=prompt('Pet nickname',p.nickname);if(n&&n.trim()){p.nickname=n.trim().slice(0,24);save();render()}}
function playWithPet(id){let pet=state.pets.find(x=>x.id===id);if(!pet)return toast('That companion is no longer in your collection.');state.petPlayDay=state.petPlayDay||{};state.petBonds=state.petBonds||{};state.petLastReaction=state.petLastReaction||{};if(state.petPlayDay[id]===state.day)return toast('You already played together today. Come back tomorrow!');state.petPlayDay[id]=state.day;state.petBonds[id]=(Number(state.petBonds[id])||0)+1;let bond=state.petBonds[id],name=pet.nickname||pet.name;state.petLastReaction[id]=({cat:bond>=10?'Your cat brings you a tiny trophy: a stolen bottle cap.':bond>=5?'Your cat finally admits you are acceptable.':'Your cat chases the toy, then pretends it was not interested.',pigeon:bond>=10?'Your pigeon shares the secret map to the best crumbs.':bond>=5?'Your pigeon trusts you with the sacred crumb stash.':'Your pigeon performs an enthusiastic crumb dance.',dragon:bond>=10?'Your dragon lets you ride a tiny circle around the room.':bond>=5?'Your dragon curls up beside you and guards your shoes.':'Your dragon sneezes a tiny harmless spark.',sock:bond>=10?'Your sock companion reveals its legendary matching-sock form.':bond>=5?'Your sock companion reveals… absolutely nothing. It is still loyal.':'Your sock companion wiggles approvingly.'})[id]||name+' enjoys your company.';state.mood=Math.min(100,(Number(state.mood)||0)+5);state.xp+=3;save();award('Quality Time with a Pet');toast(name+': '+state.petLastReaction[id]+' +3 XP');render()}
function randomEncounter(){let encounters=[{story:'A wizard gives you a Riddle Scrap.',item:'Riddle Scrap',coins:6,xp:8},{story:'A pigeon drops a coin purse.',item:'Pigeon Coin Purse',coins:14,xp:3},{story:'A robot asks for directions and leaves a Future Button.',item:'Future Button',coins:4,xp:10},{story:'A wandering sock joins your inventory.',item:'Wandering Sock',coins:2,xp:12}];let e=encounters[Math.floor(Math.random()*encounters.length)];state.inventory.push(e.item);state.xp+=e.xp;state.coins+=e.coins;state.encounterCount++;save();award('Random Encounter');toast(e.story+' +'+e.coins+' NC');render()}
let cupTimer=null,cupRound=0,cupPoints=0,cupFinished=false;
function startCup(){if(cupTimer)return;if(!$('#tournamentArena'))return;cupRound=0;cupPoints=0;cupFinished=false;nextCupRound()}
function nextCupRound(){if(cupTimer||cupFinished)return;cupRound++;let sec=7,score=0,combo=0,arena=$('#tournamentArena');if(!arena)return;arena.innerHTML='<h3>Round '+cupRound+' / 3</h3><p>Time: <b id="cupTime">7</b> · Score: <b id="cupScore" aria-live="polite">0</b> · 🔥 Combo: <b id="cupCombo" aria-live="polite">0</b></p><div class="crumb-playfield" aria-label="Tournament crumb play area"><button id="cupTarget" class="game-target" type="button" aria-label="Catch the moving tournament crumb">🍞</button></div>';const target=$('#cupTarget');target.onclick=()=>{if(sec>0){combo++;score+=combo%5===0?3:1;$('#cupScore').textContent=score;$('#cupCombo').textContent=combo;target.textContent=['🍞','🥐','🥨','🍪','🥔'][score%5];moveCrumbTarget(target);if(combo%5===0)toast('🔥 FIVE-HIT COMBO! +2 bonus points')}};cupTimer=setInterval(()=>{if(document.hidden)return;sec--;let clock=$('#cupTime');if(clock)clock.textContent=sec;if(sec<=0){clearInterval(cupTimer);cupTimer=null;cupPoints+=score>=cupRound*3?3:score>=cupRound*2?1:0;arena.innerHTML='<p>Round '+cupRound+': '+score+' crumbs · cup points '+cupPoints+'</p><button class="btn primary" id="cupContinue">'+(cupRound<3?'Next round':'Collect prize')+'</button>';$('#cupContinue').onclick=cupRound<3?nextCupRound:finishCup}},1000)}
function finishCup(){if(cupFinished)return;cupFinished=true;let prize=cupPoints>=7?60:cupPoints>=4?30:15;state.tournamentBest=Math.max(state.tournamentBest,cupPoints);state.arcadeWins++;state.coins+=prize;state.xp+=cupPoints*5;if(cupPoints>=7)state.inventory.push('Golden Crumb Trophy');save();award('Crumb Cup Competitor');toast('Cup complete! +'+prize+' NC');render()}

function startCrumbGame(){if(crumbGameActive)return;const score=$('#gameScore'),timer=$('#gameTimer'),target=$('#crumbTarget'),msg=$('#gameMessage'),start=$('#gameStart');if(!target||!timer||!msg||!start)return;crumbGameActive=true;crumbGameScore=0;crumbGameCombo=0;let left=12;score.textContent='0';$('#gameCombo').textContent='0';timer.textContent=left;msg.textContent='CATCH THE CRUMB! It moves after every hit.';target.textContent='🍞';target.style.left='50%';target.style.top='50%';target.classList.remove('crumb-caught');target.disabled=false;start.disabled=true;target.onclick=()=>{if(!crumbGameActive)return;crumbGameCombo++;crumbGameScore+=crumbGameCombo%5===0?3:1;score.textContent=crumbGameScore;$('#gameCombo').textContent=crumbGameCombo;target.textContent=['🍞','🥐','🥨','🍪','🥔'][Math.floor(Math.random()*5)];moveCrumbTarget(target);msg.textContent=crumbGameCombo%5===0?'🔥 FIVE-HIT COMBO! +2 bonus points. Total: '+crumbGameScore:'Nice catch! '+crumbGameScore+' points · '+crumbGameCombo+' hit combo.'};crumbGameTimer=setInterval(()=>{if(document.hidden)return;left--;if(timer)timer.textContent=left;if(left<=0){finishCrumbGame();if(start)start.disabled=false}},1000);}
function chaos(){const events=[{t:'A pigeon has appointed you Deputy Minister of Bread.',c:12,x:8},{t:'You found 7 coins inside a suspiciously sentient shoe.',c:7,x:4},{t:'A potato challenged you to a staring contest. You lost.',c:-3,x:6},{t:'The internet sneezed. Everyone received 5 coins.',c:5,x:5},{t:'You accidentally became mayor of a tiny imaginary island.',c:15,x:10},{t:'A mysterious stranger gave you a coupon for absolutely nothing.',c:0,x:3},{t:'The village baker paid you to stop asking about bread.',c:9,x:6}];let e=events[Math.floor(Math.random()*events.length)];state.coins=Math.max(0,state.coins+e.c);state.xp+=e.x;state.flags.chaosCount=(state.flags.chaosCount||0)+1;save();let out=$('#chaosResult');if(out)out.textContent=e.t+' '+(e.c>=0?'+':'')+e.c+' NC · +'+e.x+' XP';toast('🎲 Chaos! '+e.t);}
function randomPortal(){let routes=['npc','pigeon','ministry','browser','story','shop','bazaar','arcade','world'];let route=routes[Math.floor(Math.random()*routes.length)];let out=$('#rouletteResult');if(out)out.textContent='The universe selected: '+route.toUpperCase();if(portalTimer)clearTimeout(portalTimer);portalTimer=setTimeout(()=>{portalTimer=null;go(route)},450);}
function render(){let route=(location.hash.slice(1)||'landing').split('/')[0];if(!pages[route])route='landing';const routeChanged=currentRoute!==route;if(currentRoute&&currentRoute!==route){if(currentRoute==='arcade'&&crumbGameActive){clearInterval(crumbGameTimer);crumbGameTimer=null;crumbGameActive=false;toast('Arcade round ended when you left. Start again anytime.')}if(currentRoute==='tournament'&&cupTimer){clearInterval(cupTimer);cupTimer=null;cupRound=0;cupPoints=0;toast('Cup round cancelled when you left. You can restart anytime.')}}currentRoute=route;if(!state.stats.sitesVisited.includes(route)){state.stats.sitesVisited.push(route);save()}shellNav(route);$('#app').innerHTML=pages[route]();if(landingTicker){clearInterval(landingTicker);landingTicker=null;}if(route==='landing'){const ticker=$('#app [data-announcement]');const lines=['🚨 STOP EVERYTHING — THE INTERNET HAS A NEW PROBLEM','📢 BREAKING: LOCAL POTATO HAS REQUESTED INTERNET ACCESS','⚠️ WARNING: YOUR NEXT CLICK MAY INVOLVE A PIGEON','🎉 ABSOLUTELY NOTHING IS ON SALE. EVERYTHING IS STILL FREE'];let line=0;if(ticker&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){landingTicker=setInterval(()=>{if(document.hidden||ticker.matches(':hover')||ticker.matches(':focus-within'))return;line=(line+1)%lines.length;ticker.classList.remove('ticker-change');ticker.textContent=lines[line];void ticker.offsetWidth;ticker.classList.add('ticker-change');},5200);}}const activeNav=$('#nav .active');if(activeNav&&window.matchMedia('(max-width: 700px)').matches)activeNav.scrollIntoView({block:'nearest',inline:'center'});if(routeChanged){const heading=$('#app').querySelector('h1');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}$('#app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#app').querySelectorAll('.card').forEach(c=>{const destination=c.querySelector('[data-go]');if(!destination)return;c.tabIndex=0;c.setAttribute('role','link');c.setAttribute('aria-label','Open '+(c.querySelector('h3')?.textContent||'destination'));c.addEventListener('click',event=>{if(!event.target.closest('button,a,input'))go(destination.dataset.go)});c.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target===c){event.preventDefault();go(destination.dataset.go)}})});$('#app').querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>npcChoice(Number(b.dataset.dialog)));$('#app').querySelectorAll('[data-pigeon-like]').forEach(b=>b.onclick=()=>togglePigeonLike(b.dataset.pigeonLike));$('#app').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('#app').querySelectorAll('[data-permit]').forEach(b=>b.onclick=()=>permit(b.dataset.permit));$('#app').querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>fakeSite(b.dataset.site));$('#app').querySelectorAll('[data-claim-quest]').forEach(b=>b.onclick=()=>claimQuest(b.dataset.claimQuest));$('#app').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(b.dataset.buy));$('#app').querySelectorAll('[data-sell-index]').forEach(b=>b.onclick=()=>sellItem(Number(b.dataset.sellIndex)));$('#app').querySelectorAll('[data-character-claim]').forEach(b=>b.onclick=()=>claimCharacterJob(b.dataset.characterClaim));$('#app').querySelectorAll('[data-world-event]').forEach(b=>b.onclick=claimWorldEvent);$('#app').querySelectorAll('[data-map-go]').forEach(b=>b.onclick=()=>go(b.dataset.mapGo));$('#app').querySelectorAll('[data-hidden-find]').forEach(b=>b.onclick=()=>findHidden(b.dataset.hiddenFind));$('#app').querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>adoptPet(b.dataset.adopt));$('#app').querySelectorAll('[data-pet-active]').forEach(b=>b.onclick=()=>{state.petActive=b.dataset.petActive;save();render()});$('#app').querySelectorAll('[data-pet-name]').forEach(b=>b.onclick=()=>renamePet(b.dataset.petName));$('#app').querySelectorAll('[data-pet-play]').forEach(b=>b.onclick=()=>playWithPet(b.dataset.petPlay));$('#app').q function action(a){if(a==='work'){state.stats.workShifts++;earn(12,10);toast('Shift complete. You earned 12 NC.');render()}if(a==='sleep'){state.day++;state.mood=Math.min(100,state.mood+15);state.location='Village Square';save();toast('A new day begins. Nothing has changed.');render()}if(a==='post'){let txt=$('#postText').value.trim();if(!txt)return toast('You cannot publish an empty squawk.');if(txt.length>180)return toast('Squawks are limited to 180 characters.');let duplicate=state.posts.some(p=>p.by.toLowerCase()===state.name.toLowerCase()&&p.txt.trim().toLowerCase()===txt.toLowerCase());if(duplicate)return toast('You already published that squawk. Try saying it differently.');state.posts.push({by:state.name,txt,likes:0});if(state.posts.length>100)state.posts.splice(0,state.posts.length-100);state.stats.posts++;earn(1,2);award('First Public Squawk');render();toast('Your squawk has entered the ecosystem.')}if(a==='rename'){let n=$('#nameInput').value.trim();if(!n)return toast('A name is required.');state.name=n;save();render();toast('Identity updated. The government is confused.')}if(a==='read-manifesto'){let p=$('#manifestoResult');if(p){p.textContent='The manifesto says: “The crumb opens the door. The recipe opens the moon.” A second website may be hidden among the stars.';p.classList.remove('hidden')}state.storyStage=Math.max(state.storyStage,1);state.xp+=12;award('Read the Forbidden Manifesto');save()}if(a==='backup'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='unhinged-internet-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported. Keep this file somewhere safe.')}if(a==='import'){$('#saveImport')?.click()}if(a==='reset'){if(confirm('Reset all local universe progress? Export a backup first if you want to keep it.')){localStorage.removeItem('unhinged-save');state={...defaults,flags:{},stats:{conversations:0,posts:0,permits:0,workShifts:0,sitesVisited:[]},relationships:{},relationshipMemories:{},pets:[],petActive:'',hiddenFinds:[],arcadeWins:0,tournamentBest:0,encounterCount:0,clues:[],unlocks:{},storyStage:0,claimedQuests:[],characterQuests:[],tradeCompleted:0};save();go('home')}}}
function permit(id){let labels={identity:'NPC Identity Card',potato:'Potato Ownership Permit',sock:'Missing Sock Investigation',stand:'Standing Around License'};if(state.coins<5){$('#permitResult').textContent='APPLICATION REJECTED: insufficient nonsense coins.';return}state.coins-=5;state.inventory.push(labels[id]);state.stats.permits++;state.xp+=5;save();$('#permitResult').textContent='APPROVED: '+labels[id]+' issued. Please display it to absolutely nobody.';award('Licensed Citizen')}
function fakeSite(site){let copy={portal:'<h2>Welcome to my homepage!!!</h2><p>✨ Visitor '+(100+state.xp)+' ✨</p><p>UNDER CONSTRUCTION. Always.</p>',webring:'<h2>THE POTATO WEBRING</h2><p>Previous site ← You are here → Next site</p><p>Only 3 websites are in this webring. One is missing.</p>',conspiracy:'<h2>THE MOON IS A POTATO?</h2><p>Evidence: it is round. Potatoes are round. Wake up, villagers.</p><p>Last updated: 03/14/1999</p>',guestbook:'<h2>GUESTBOOK</h2><p>“Cool page!!!” — Anonymous</p><p>“Please stop emailing me.” — Webmaster</p><p>“I was here.” — You, probably</p>'};$('#fakeSite').innerHTML=copy[site]||copy.portal;earn(0,1)}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;updateInstallButton();});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButton();toast('The Unhinged Internet is installed!');});window.addEventListener('pagehide',()=>{try{localStorage.setItem('unhinged-save',JSON.stringify(state))}catch(error){console.warn('Final local save could not be written:',error)}});$('#installBtn').addEventListener('click',installPWA);document.querySelector('.stats [data-chaos]')?.addEventListener('click',chaos);document.querySelectorAll('[data-stat-action]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.statAction)));updateInstallButton();window.addEventListener('hashchange',render);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));updateHeader();if(recoveredSave)toast('Your main save was damaged. Recovered the latest automatic local backup.');render();
})();
