.interactive-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.searchbox{flex:1;min-width:190px;padding:11px 13px;border:1px solid var(--line);background:#111722;color:var(--ink);border-radius:11px}.gamearena{border:1px dashed #78849d;border-radius:18px;padding:22px;text-align:center;background:radial-gradient(circle at 50% 40%,#30384c,#171b27)}.game-target{font-size:clamp(64px,13vw,112px);border:0;background:transparent;transition:transform .1s}.game-target:active{transform:scale(.85)}.game-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.game-stat{padding:8px 13px;border-radius:12px;background:#111722;border:1px solid var(--line)}.portal-empty{grid-column:1/-1;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

<body><div class="shell">
<header class="top"><div class="brand"><div class="logo">✳</div><div>THE UNHINGED INTERNET<small>THE INTERNET IS A QUESTIONABLE PLACE</small></div></div><div class="stats"><button class="btn" data-chaos title="Trigger a random universe event">🎲 Chaos</button><span class="chip">👤 <b id="topName">Guest NPC</b></span><span class="chip">🪙 <b id="topCoins">100</b> NC</span><span class="chip">🏆 <b id="topLevel">Level 1</b></span></div></header>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const defaults={name:'Guest NPC',coins:100,xp:0,day:1,location:'Village Square',mood:50,reputation:0,inventory:['One suspicious potato'],posts:[],achievements:[],visited:[],flags:{},job:'Professional Loiterer'};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem('unhinged-save')||'{}')};}catch{state={...defaults};}
state.name=typeof state.name==='string'&&state.name.trim()?state.name.trim().slice(0,24):defaults.name;state.job=typeof state.job==='string'?state.job:defaults.job;state.location=typeof state.location==='string'?state.location:defaults.location;state.coins=Math.max(0,Number.isFinite(Number(state.coins))?Number(state.coins):defaults.coins);state.xp=Math.max(0,Number.isFinite(Number(state.xp))?Number(state.xp):0);state.day=Math.max(1,Number.isFinite(Number(state.day))?Math.floor(Number(state.day)):1);state.mood=Math.max(0,Math.min(100,Number.isFinite(Number(state.mood))?Number(state.mood):defaults.mood));state.reputation=Number.isFinite(Number(state.reputation))?Number(state.reputation):0;state.inventory=Array.isArray(state.inventory)?state.inventory.filter(x=>typeof x==='string'):defaults.inventory.slice();state.posts=Array.isArray(state.posts)?state.posts.filter(x=>x&&typeof x==='object'&&typeof x.txt==='string'):[];state.achievements=Array.isArray(state.achievements)?state.achievements.filter(x=>typeof x==='string'):[];state.visited=Array.isArray(state.visited)?state.visited:[];state.flags=state.flags&&typeof state.flags==='object'?state.flags:{};state.relationships={...(state.relationships||{})};state.clues=Array.isArray(state.clues)?state.clues:[];state.unlocks={...(state.unlocks||{})};state.storyStage=Number(state.storyStage)||0;state.stats={conversations:0,posts:0,permits:0,workShifts:0,sitesVisited:[],...(state.stats||{})};state.stats.sitesVisited=Array.isArray(state.stats.sitesVisited)?state.stats.sitesVisited:[];state.claimedQuests=Array.isArray(state.claimedQuests)?state.claimedQuests:[];state.characterQuests=Array.isArray(state.characterQuests)?state.characterQuests:[];state.tradeCompleted=Number(state.tradeCompleted)||0;state.relationshipMemories={...(state.relationshipMemories||{})};state.pets=Array.isArray(state.pets)?state.pets:[];state.petActive=state.petActive||'';state.hiddenFinds=Array.isArray(state.hiddenFinds)?state.hiddenFinds:[];state.arcadeWins=Number(state.arcadeWins)||0;state.tournamentBest=Number(state.tournamentBest)||0;state.encounterCount=Number(state.encounterCount)||0;
const save=()=>{localStorage.setItem('unhinged-save',JSON.stringify(state));updateHeader()};
const updateHeader=()=>{$('#topName').textContent=state.name;$('#topCoins').textContent=state.coins;$('#topLevel').textContent='Level '+(1+Math.floor(state.xp/100))};
const toast=msg=>{let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2100)};
const earn=(coins,xp=5)=>{state.coins=Math.max(0,state.coins+coins);state.xp+=xp;save()};
const award=id=>{if(!state.achievements.includes(id)){state.achievements.push(id);toast('🏆 Achievement unlocked: '+id);save()}};
const navItems=()=>[['home','🏠 Home'],['explore','🧭 Explore'],['map','🗺️ Map'],['arcade','🎮 Arcade'],['pets','🐾 Pets'],['tournament','🏁 Tournament'],['world','🌐 World'],['story','🕵️ Story'],['quests','📜 Quests'],['shop','🛒 Shop'],['bazaar','🤝 Bazaar'],['characterquests','🧩 Character Jobs'],['npc','🧍 NPC Life'],['pigeon','🐦 PigeonBook'],['ministry','🏛️ Ministry'],['browser','🖥️ Fake Internet'],...(state.unlocks.backrooms?[['backrooms','🕳️ Backrooms']]:[]),...(state.unlocks.moonforum?[['moonforum','🌙 Moon Forum']]:[]),['profile','👤 My Profile']];
function go(route){location.hash=route}
function shellNav(route){$('#nav').innerHTML=navItems().map(([r,l])=>'<button class="'+(route===r?'active':'')+'" data-go="'+r+'">'+l+'</button>').join('');$('#nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
const card=(emoji,title,desc,route,tag='WEBSITE')=>'<article class="card"><div class="emoji">'+emoji+'</div><div class="tag">'+tag+'</div><h3>'+title+'</h3><p>'+desc+'</p><div class="cardfoot"><span class="muted">Explore this corner</span><button class="btn" data-go="'+route+'">Enter ↗</button></div></article>';
function home(){return '<section class="hero"><div class="eyebrow">WELCOME TO THE OTHER INTERNET</div><h1>A whole internet.<br>A terrible idea.</h1><p>Explore suspicious websites, meet deeply unqualified characters, obtain questionable employment and accidentally become a legend. Nothing here is important. Everything is connected.</p><div class="actions"><button class="btn primary" data-go="explore">Explore the internet →</button><button class="btn" data-go="npc">Start an NPC life</button></div></section><div class="sectionhead"><div><div class="eyebrow">PICK A PORTAL</div><h2>Popular destinations</h2></div><span class="muted">No useful information guaranteed</span></div><div class="grid">'+card('🧍','NPC Life','A hero needs directions. You need a pension.','npc','PLAYABLE SIMULATOR')+card('🐦','PigeonBook','The social network where bread is currency.','pigeon','SOCIAL NETWORK')+card('🏛️','Ministry of Useless Affairs','Apply for permits nobody should need.','ministry','GOVERNMENT')+card('🖥️','Fake Internet 1999','Browse a tiny collection of questionable old sites.','browser','RETRO BROWSER')+card('🧪','Department of Bad Ideas','Coming soon: submit your worst idea.','explore','COMING SOON')+card('👻','The Forgotten Server','A mysterious directory with missing pages.','explore','MYSTERY')+'</div><div class="sectionhead"><h2>📡 Latest universe bulletin</h2></div><div class="box"><b>BREAKING:</b> Local potato has refused to cooperate with authorities. Ministry officials say the potato is “acting like a potato.”</div>'}
const districts=[['🎮','Gaming District','Games, quests and simulators.','npc'],['📱','Social District','Networks, arguments and pigeon influencers.','pigeon'],['🏛️','Government District','Permits, departments and official confusion.','ministry'],['💾','Technology District','Retro browsers and simulated computer oddities.','browser'],['👁️','Mystery District','Lost websites, strange clues and secrets.','browser'],['🤡','Nonsense District','Tools that solve problems nobody has.','explore']];
function explore(){return '<div class="pagehead"><div class="eyebrow">THE DIRECTORY</div><h1>Explore the internet</h1><p class="muted">Six districts. Several questionable life choices.</p></div><div class="interactive-tools"><input id="portalSearch" class="searchbox" type="search" placeholder="Search portals, districts and weird things..." aria-label="Search portals"><span class="chip" id="portalCount">6 districts</span></div><div class="grid" id="districtGrid">'+districts.map(d=>card(...d,'DISTRICT')).join('')+'</div><div class="sectionhead"><h2>Coming to this universe</h2></div><div class="grid">'+[['🥔','War of the Potatoes'],['🏢','Office of Useless Affairs'],['🛒','Useless Shopping Mall'],['👽','Alien Customer Service'],['🧦','National Sock Investigation'],['🕳️','Digital Backrooms']].map(x=>card(x[0],x[1],'This portal is on the development list.','explore','COMING SOON')).join('')+'</div><div class="sectionhead"><h2>Lost? Try your luck.</h2></div><div class="box"><p>Let the universe choose your next questionable destination.</p><button class="btn primary" data-random-portal>🎲 Take me somewhere random</button></div>'}
const npcLines=[
['A hero approaches you.','“Excuse me, do you know where the Dragon Cave is?”',['I have no idea. I live here.','Have you tried turning left?','I used to be an adventurer like you...','Buy my suspicious potato.','...'],['“That is concerning.” The hero walks away.','“There is no left.” You both stare at a map.','The hero asks you not to finish that sentence.','The potato glows. The hero pays you 15 coins.','You stare into the middle distance.']],
['The village baker looks exhausted.','“Can you watch the shop for five minutes?”',['Absolutely. I am trustworthy.','I will eat the evidence.','What is the salary?','I am actually a dragon.','Pretend I was never here.'],['You are promoted to temporary bread supervisor.','Three loaves disappear. Nobody can prove anything.','The baker offers 8 coins.','The baker looks at you. “No, you are not.”','The baker leaves. You guard an empty chair.']],
['A guard blocks the road.','“State your business.”',['I am just standing here.','Official potato inspector.','I forgot.','I demand a tiny hat.','Can I interest you in a potato?'],['The guard nods. Standing is permitted.','The guard requests your imaginary badge.','The guard respects your honesty.','The guard gives you a tiny hat.','The guard buys the potato for 10 coins.']]
];
function npc(){let idx=state.flags.npcScene||0;let scene=npcLines[idx%npcLines.length];let who=npcRelationName(idx),memory=state.relationshipMemories[who]||{talks:0,last:'No conversations yet.'};return '<div class="pagehead"><div class="eyebrow">GAMING DISTRICT / LIFE SIMULATOR</div><h1>NPC Life</h1><p class="muted">Day '+state.day+' · '+state.location+' · Job: '+state.job+'</p></div><div class="layout"><section class="box"><div style="font-size:46px">🧍‍♂️　🧙</div><div class="tag">RANDOM ENCOUNTER</div><h2>'+scene[0]+'</h2><p>'+scene[1]+'</p><h3>Choose your dialogue</h3>'+scene[2].map((x,i)=>'<button class="choice" data-dialog="'+i+'">'+(i+1)+'. '+x+'</button>').join('')+'<div id="npcResult" class="notice hidden"></div><div class="memory"><b>🧠 '+escapeHTML(who)+' remembers you</b><br>'+memory.talks+' previous conversations · Last choice: '+escapeHTML(memory.last||'Not met yet')+'</div><button class="btn" data-random-encounter>🎲 Find a random encounter</button><div class="actions"><button class="btn" data-action="work">Do a questionable shift (+12 NC)</button><button class="btn" data-action="sleep">Go home / next day</button></div></section><aside class="box"><h3>📋 NPC status</h3><p>Mood</p><div class="bar"><span style="width:'+state.mood+'%"></span></div><p>Reputation: <b>'+state.reputation+'</b></p><p>Coins: <b>'+state.coins+' NC</b></p><p>Inventory</p><ul>'+state.inventory.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="notice">Local prophecy: You are not the chosen one. You are barely the backup one.</div><p><b>Relationship:</b> '+npcRelationName(state.flags.npcScene||0)+' · '+(state.relationships[npcRelationName(state.flags.npcScene||0)]||0)+' trust</p><button class="btn" data-clue="guard-ledger">Ask about the missing crumb</button></aside></div>'}
function npcChoice(i){let idx=(Number(state.flags.npcScene)||0)%npcLines.length;let scene=npcLines[idx];if(!Number.isInteger(i)||i<0||i>=scene[2].length)return;let result=scene[3][i];let reward=[2,1,0,15,0][i];if(idx===1)reward=[0,-2,8,0,0][i];if(idx===2)reward=[0,0,2,0,10][i];state.coins=Math.max(0,state.coins+reward);state.xp+=8;state.stats.conversations++;let person=npcRelationName(idx);state.relationships[person]=(state.relationships[person]||0)+1;state.relationshipMemories[person]=state.relationshipMemories[person]||{talks:0,last:''};state.relationshipMemories[person].talks++;state.relationshipMemories[person].last=scene[2][i];if(person==='Gate Guard Greg'&&state.relationships[person]>=2&&!state.unlocks.moonforum){state.unlocks.moonforum=true;toast('Secret website unlocked: Moon Forum!')}state.reputation+=i===3?1:0;state.mood=Math.max(5,Math.min(100,state.mood+(i===4?-3:2)));state.flags.npcScene=idx+1;state.flags.npcResult=result;save();award('First Conversation');render()}
function pigeon(){let posts=state.posts.length?state.posts:[{by:'Mayor Pigeon',txt:'URGENT: Bread prices are up 400%. This is a dark day for beak-kind.',likes:12},{by:'DefinitelyNotARat',txt:'Hello fellow pigeons. I enjoy seeds and definitely do not operate a cheese-based intelligence network.',likes:4},{by:'BreadEnjoyer99',txt:'just dropped a crumb. biggest day of my life.',likes:28}];return '<div class="pagehead"><div class="eyebrow">SOCIAL DISTRICT</div><h1>🐦 PigeonBook</h1><p class="muted">Connect. Squawk. Demand bread.</p></div><div class="layout"><section class="box"><h2>Public flock feed</h2><label for="postText">Broadcast a thought to the flock</label><textarea id="postText" class="field" rows="3" maxlength="180" placeholder="The bread economy is collapsing..."></textarea><button class="btn primary" data-action="post">Publish squawk</button>'+posts.slice().reverse().map(p=>'<div class="feeditem"><strong>🐦 '+escapeHTML(p.by)+'</strong><p>'+escapeHTML(p.txt)+'</p><span class="muted">❤️ '+p.likes+' crumbs of approval</span></div>').join('')+'</section><aside class="box"><h3>Flock trends</h3><p>#BreadGate</p><p>#SuspiciousHumans</p><p>#PigeonInflation</p><div class="notice">This is a fictional local feed. Your posts stay in this browser.</div><button class="btn" data-clue="pigeon-crumb">Investigate the mayor’s pinned crumb report</button></aside></div>'}

function world(){let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];let claimed=state.flags.eventClaimedDay===state.day;return '<div class="pagehead"><div class="eyebrow">THE SHARED UNIVERSE</div><h1>🌐 World Hub</h1><p class="muted">One world state connects the websites, characters, currency and your adventures.</p></div><div class="layout"><section class="box"><div class="tag">TODAY\'S WORLD EVENT · DAY '+state.day+'</div><h2>'+event.icon+' '+event.title+'</h2><p>'+event.desc+'</p><button class="btn primary" data-world-event '+(claimed?'disabled':'')+'>'+(claimed?'Event reward collected':'Investigate event')+'</button><p class="muted">'+(claimed?'You already investigated today. Sleep in NPC Life to advance the day.':'One event reward is available per in-game day.')+'</p></section><aside class="box"><h3>🗺️ World status</h3><p>Destinations visited: <b>'+state.stats.sitesVisited.length+'</b></p><p>NPC conversations: <b>'+state.stats.conversations+'</b></p><p>Public squawks: <b>'+state.stats.posts+'</b></p><p>Permits collected: <b>'+state.stats.permits+'</b></p><p>Work shifts: <b>'+state.stats.workShifts+'</b></p><button class="btn" data-go="quests">Open quest board →</button></aside></div><div class="sectionhead"><h2>People you may encounter</h2></div><div class="grid">'+[['🧙','The Lost Hero','Needs directions. Has no map.'],['🥖','Martha the Baker','Runs the village bakery and pays badly.'],['🛡️','Gate Guard Greg','Protects the road from suspicious potatoes.'],['🐦','Mayor Pigeon','Elected by a landslide of crumbs.']].map(n=>'<article class="card"><div class="emoji">'+n[0]+'</div><h3>'+n[1]+'</h3><p>'+n[2]+'</p></article>').join('')+'</div><div class="sectionhead"><h2>Shared world rules</h2></div><div class="box"><p>Coins, XP, inventory, achievements, NPC encounters, social posts, permits and quest progress all belong to the same local player save. This is a single-player simulated world; it does not create real online multiplayer or cross-device sync.</p></div>'}
function claimQuest(id){let q=questDefs.find(x=>x.id===id);if(!q||state.claimedQuests.includes(id)||questProgress(q)<q.target)return;state.claimedQuests.push(id);state.coins+=q.reward;state.xp+=q.xp;award('Quest: '+q.title);save();toast('Quest reward collected!');render()}
function claimWorldEvent(){if(state.flags.eventClaimedDay===state.day)return;let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];state.flags.eventClaimedDay=state.day;state.coins+=10;state.xp+=10;state.inventory.push(event.item);save();award('World Event Explorer');toast('Event reward: '+event.item);render()}

function buyItem(id){let item=shopItems.find(x=>x.id===id);if(!item)return;if(state.coins<item.price)return toast('Not enough coins. Go do questionable work.');state.coins-=item.price;state.inventory.push(item.name);state.xp+=2;save();award('First Shop Purchase');toast('Purchased '+item.name+'!');render()}
function sellItem(i){let name=state.inventory[i];if(!name)return;let item=shopItems.find(x=>x.name===name),value=item?Math.max(1,Math.floor(item.price*.45)):2;state.inventory.splice(i,1);state.coins+=value;state.tradeCompleted++;state.xp+=3;save();award('First Bazaar Sale');toast('Sold '+name+' for '+value+' NC.');render()}

const petOptions=[{id:'cat',name:'Crumb Cat',emoji:'🐈',cost:35},{id:'pigeon',name:'Pocket Pigeon',emoji:'🐦',cost:50},{id:'dragon',name:'Potato Dragon',emoji:'🐉',cost:85},{id:'sock',name:'Ghost Sock',emoji:'🧦',cost:60}];
function pets(){return '<div class="pagehead"><div class="eyebrow">COMPANION MANAGEMENT</div><h1>🐾 Questionable Pets</h1><p class="muted">Adopt a tiny friend. Your companions are saved locally.</p></div><div class="grid">'+petOptions.map(p=>'<article class="card"><div class="pet">'+p.emoji+'</div><h3>'+p.name+'</h3><p>Small friend. Large chaos.</p><b>'+p.cost+' NC</b><button class="btn primary" data-adopt="'+p.id+'" '+(state.pets.some(x=>x.id===p.id)||state.coins<p.cost?'disabled':'')+'>'+(state.pets.some(x=>x.id===p.id)?'Adopted':'Adopt')+'</button></article>').join('')+'</div><div class="sectionhead"><h2>Your companions</h2></div><div class="grid">'+state.pets.map(p=>'<article class="card"><div class="pet">'+p.emoji+'</div><h3>'+escapeHTML(p.name)+'</h3><p>'+escapeHTML(p.nickname||p.name)+'</p><button class="btn" data-pet-active="'+p.id+'">'+(state.petActive===p.id?'Following ✓':'Bring along')+'</button><button class="btn" data-pet-name="'+p.id+'">Rename</button></article>').join('')+'</div>'}
function tournament(){return '<div class="pagehead"><div class="eyebrow">ARCADE / COMPETITION</div><h1>🏁 Crumb Cup</h1><p class="muted">Three timed rounds. Tap the crumb before time runs out.</p></div><div class="box"><p>Best cup score: <b>'+state.tournamentBest+'</b> · Cups played: <b>'+state.arcadeWins+'</b></p><button class="btn primary" data-tournament-start>Start Crumb Cup</button><div id="tournamentArena" class="gamearena"><p>Ready, crumb champion?</p></div></div>'}

const pages={home,explore,map:mapPage,arcade,pets,tournament,world,story,quests,shop,bazaar,characterquests,npc,pigeon,ministry,browser,backrooms,moonforum,profile};

function findHidden(id){if(state.hiddenFinds.includes(id))return;state.hiddenFinds.push(id);let r={bench:[8,4,'Bench Coin'],sock:[3,8,'Mystery Sock'],feather:[5,7,'Glowing Feather'],potato:[12,10,'Spectacle Potato']}[id];if(!r)return;state.coins+=r[0];state.xp+=r[1];state.inventory.push(r[2]);save();award('Hidden Object Hunter');toast('Found '+r[2]+'!');render()}
function adoptPet(id){let p=petOptions.find(x=>x.id===id);if(!p||state.pets.some(x=>x.id===id)||state.coins<p.cost)return toast('Cannot adopt this pet yet.');state.coins-=p.cost;state.pets.push({id,name:p.name,emoji:p.emoji,nickname:p.name});state.xp+=8;save();award('First Pet');render();toast(p.name+' joined you!')}
function renamePet(id){let p=state.pets.find(x=>x.id===id);if(!p)return;let n=prompt('Pet nickname',p.nickname);if(n&&n.trim()){p.nickname=n.trim().slice(0,24);save();render()}}
function randomEncounter(){let encounters=[{story:'A wizard gives you a Riddle Scrap.',item:'Riddle Scrap',coins:6,xp:8},{story:'A pigeon drops a coin purse.',item:'Pigeon Coin Purse',coins:14,xp:3},{story:'A robot asks for directions and leaves a Future Button.',item:'Future Button',coins:4,xp:10},{story:'A wandering sock joins your inventory.',item:'Wandering Sock',coins:2,xp:12}];let e=encounters[Math.floor(Math.random()*encounters.length)];state.inventory.push(e.item);state.xp+=e.xp;state.coins+=e.coins;state.encounterCount++;save();award('Random Encounter');toast(e.story+' +'+e.coins+' NC');render()}
let cupTimer=null,cupRound=0,cupPoints=0;
function startCup(){if(cupTimer)return;cupRound=0;cupPoints=0;nextCupRound()}
function nextCupRound(){cupRound++;let sec=7,score=0,arena=$('#tournamentArena');if(!arena)return;arena.innerHTML='<h3>Round '+cupRound+' / 3</h3><p>Time: <b id="cupTime">7</b> · Score: <b id="cupScore">0</b></p><button id="cupTarget" class="game-target">🍞</button>';$('#cupTarget').onclick=()=>{$('#cupScore').textContent=++score};cupTimer=setInterval(()=>{sec--;if($('#cupTime'))$('#cupTime').textContent=sec;if(sec<=0){clearInterval(cupTimer);cupTimer=null;cupPoints+=score>=cupRound*3?3:score>=cupRound*2?1:0;arena.innerHTML='<p>Round '+cupRound+': '+score+' crumbs · cup points '+cupPoints+'</p><button class="btn primary" id="cupContinue">'+(cupRound<3?'Next round':'Collect prize')+'</button>';$('#cupContinue').onclick=cupRound<3?nextCupRound:finishCup}},1000)}
function finishCup(){let prize=cupPoints>=7?60:cupPoints>=4?30:15;state.tournamentBest=Math.max(state.tournamentBest,cupPoints);state.arcadeWins++;state.coins+=prize;state.xp+=cupPoints*5;if(cupPoints>=7)state.inventory.push('Golden Crumb Trophy');save();award('Crumb Cup Competitor');toast('Cup complete! +'+prize+' NC');render()}

let crumbGameTimer=null,crumbGameActive=false,crumbGameScore=0;
function finishCrumbGame(){if(!crumbGameActive)return;crumbGameActive=false;clearInterval(crumbGameTimer);crumbGameTimer=null;let reward=Math.floor(crumbGameScore/2);state.coins+=reward;state.xp+=crumbGameScore;state.arcadeBest=Math.max(state.arcadeBest||0,crumbGameScore);save();let msg=$('#gameMessage');if(msg)msg.textContent='TIME! You caught '+crumbGameScore+' crumbs and earned '+reward+' NC + '+crumbGameScore+' XP.';let target=$('#crumbTarget'),start=$('#gameStart');if(target)target.disabled=true;if(start)start.textContent='Play again';award('First Arcade Game');}
function startCrumbGame(){if(crumbGameActive)return;crumbGameActive=true;crumbGameScore=0;let left=12;const score=$('#gameScore'),timer=$('#gameTimer'),target=$('#crumbTarget'),msg=$('#gameMessage'),start=$('#gameStart');if(!target||!timer)return;score.textContent='0';timer.textContent=left;msg.textContent='CATCH THE CRUMB!';target.disabled=false;start.disabled=true;target.onclick=()=>{if(!crumbGameActive)return;crumbGameScore++;score.textContent=crumbGameScore;target.textContent=['🍞','🥐','🥨','🍪','🥔'][Math.floor(Math.random()*5)];};crumbGameTimer=setInterval(()=>{left--;if(timer)timer.textContent=left;if(left<=0){finishCrumbGame();if(start)start.disabled=false}},1000);}
function chaos(){const events=[{t:'A pigeon has appointed you Deputy Minister of Bread.',c:12,x:8},{t:'You found 7 coins inside a suspiciously sentient shoe.',c:7,x:4},{t:'A potato challenged you to a staring contest. You lost.',c:-3,x:6},{t:'The internet sneezed. Everyone received 5 coins.',c:5,x:5},{t:'You accidentally became mayor of a tiny imaginary island.',c:15,x:10},{t:'A mysterious stranger gave you a coupon for absolutely nothing.',c:0,x:3},{t:'The village baker paid you to stop asking about bread.',c:9,x:6}];let e=events[Math.floor(Math.random()*events.length)];state.coins=Math.max(0,state.coins+e.c);state.xp+=e.x;state.flags.chaosCount=(state.flags.chaosCount||0)+1;save();let out=$('#chaosResult');if(out)out.textContent=e.t+' '+(e.c>=0?'+':'')+e.c+' NC · +'+e.x+' XP';toast('🎲 Chaos! '+e.t);}
function randomPortal(){let routes=['npc','pigeon','ministry','browser','story','shop','bazaar','arcade','world'];let route=routes[Math.floor(Math.random()*routes.length)];let out=$('#rouletteResult');if(out)out.textContent='The universe selected: '+route.toUpperCase();setTimeout(()=>go(route),450);}
function render(){let route=(location.hash.slice(1)||'home').split('/')[0];if(!pages[route])route='home';if(!state.stats.sitesVisited.includes(route)){state.stats.sitesVisited.push(route);save()}shellNav(route);$('#app').innerHTML=pages[route]();$('#app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#app').querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>npcChoice(Number(b.dataset.dialog)));$('#app').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('#app').querySelectorAll('[data-permit]').forEach(b=>b.onclick=()=>permit(b.dataset.permit));$('#app').querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>fakeSite(b.dataset.site));$('#app').querySelectorAll('[data-claim-quest]').forEach(b=>b.onclick=()=>claimQuest(b.dataset.claimQuest));$('#app').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(b.dataset.buy));$('#app').querySelectorAll('[data-sell-index]').forEach(b=>b.onclick=()=>sellItem(Number(b.dataset.sellIndex)));$('#app').querySelectorAll('[data-character-claim]').forEach(b=>b.onclick=()=>claimCharacterJob(b.dataset.characterClaim));$('#app').querySelectorAll('[data-world-event]').forEach(b=>b.onclick=claimWorldEvent);$('#app').querySelectorAll('[data-map-go]').forEach(b=>b.onclick=()=>go(b.dataset.mapGo));$('#app').querySelectorAll('[data-hidden-find]').forEach(b=>b.onclick=()=>findHidden(b.dataset.hiddenFind));$('#app').querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>adoptPet(b.dataset.adopt));$('#app').querySelectorAll('[data-pet-active]').forEach(b=>b.onclick=()=>{state.petActive=b.dataset.petActive;save();render()});$('#app').querySelectorAll('[data-pet-name]').forEach(b=>b.onclick=()=>renamePet(b.dataset.petName));$('#app').querySelectorAll('[data-random-encounter]').forEach(b=>b.onclick=randomEncounter);$('#app').querySelectorAll('[data-tournament-start]').forEach(b=>b.onclick=startCup);$('#app').querySelectorAll('[data-clue]').forEach(b=>b.onclick=()=>collectClue(b.dataset.clue));$('#app').querySelectorAll('[data-chaos]').forEach(b=>b.onclick=chaos);$('#app').querySelectorAll('[data-random-portal]').forEach(b=>b.onclick=randomPortal);const start=$('#gameStart');if(start)start.onclick=startCrumbGame;const search=$('#portalSearch');if(search)search.oninput=()=>{let q=search.value.toLowerCase(),cards=[...$('#districtGrid').querySelectorAll('.card')],shown=0;cards.forEach(c=>{let match=c.textContent.toLowerCase().includes(q);c.classList.toggle('hidden',!match);if(match)shown++});$('#portalCount').textContent=shown+' matching portals';if(!shown&&!$('#districtGrid .portal-empty'))$('#districtGrid').insertAdjacentHTML('beforeend','<div class="portal-empty">No portals found. The pigeons ate that result.</div>');else if(shown){let empty=$('#districtGrid .portal-empty');if(empty)empty.remove()}};}
function action(a){if(a==='work'){state.stats.workShifts++;earn(12,10);toast('Shift complete. You earned 12 NC.');render()}if(a==='sleep'){state.day++;state.mood=Math.min(100,state.mood+15);state.location='Village Square';save();toast('A new day begins. Nothing has changed.');render()}if(a==='post'){let txt=$('#postText').value.trim();if(!txt)return toast('You cannot publish an empty squawk.');state.posts.push({by:state.name,txt,likes:0});state.stats.posts++;earn(1,2);award('First Public Squawk');render();toast('Your squawk has entered the ecosystem.')}if(a==='rename'){let n=$('#nameInput').value.trim();if(!n)return toast('A name is required.');state.name=n;save();render();toast('Identity updated. The government is confused.')}if(a==='read-manifesto'){let p=$('#manifestoResult');if(p){p.textContent='The manifesto says: “The crumb opens the door. The recipe opens the moon.” A second website may be hidden among the stars.';p.classList.remove('hidden')}state.storyStage=Math.max(state.storyStage,1);state.xp+=12;award('Read the Forbidden Manifesto');save()}if(a==='backup'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='unhinged-internet-save.json';a.click();URL.revokeObjectURL(url)}if(a==='reset'){if(confirm('Reset all local universe progress? Export a backup first if you want to keep it.')){localStorage.removeItem('unhinged-save');state={...defaults,flags:{},stats:{conversations:0,posts:0,permits:0,workShifts:0,sitesVisited:[]},relationships:{},relationshipMemories:{},pets:[],petActive:'',hiddenFinds:[],arcadeWins:0,tournamentBest:0,encounterCount:0,clues:[],unlocks:{},storyStage:0,claimedQuests:[],characterQuests:[],tradeCompleted:0};save();go('home')}}}
function permit(id){let labels={identity:'NPC Identity Card',potato:'Potato Ownership Permit',sock:'Missing Sock Investigation',stand:'Standing Around License'};if(state.coins<5){$('#permitResult').textContent='APPLICATION REJECTED: insufficient nonsense coins.';return}state.coins-=5;state.inventory.push(labels[id]);state.stats.permits++;state.xp+=5;save();$('#permitResult').textContent='APPROVED: '+labels[id]+' issued. Please display it to absolutely nobody.';award('Licensed Citizen')}
function fakeSite(site){let copy={portal:'<h2>Welcome to my homepage!!!</h2><p>✨ Visitor '+(100+state.xp)+' ✨</p><p>UNDER CONSTRUCTION. Always.</p>',webring:'<h2>THE POTATO WEBRING</h2><p>Previous site ← You are here → Next site</p><p>Only 3 websites are in this webring. One is missing.</p>',conspiracy:'<h2>THE MOON IS A POTATO?</h2><p>Evidence: it is round. Potatoes are round. Wake up, villagers.</p><p>Last updated: 03/14/1999</p>',guestbook:'<h2>GUESTBOOK</h2><p>“Cool page!!!” — Anonymous</p><p>“Please stop emailing me.” — Webmaster</p><p>“I was here.” — You, probably</p>'};$('#fakeSite').innerHTML=copy[site]||copy.portal;earn(0,1)}
window.addEventListener('hashchange',render);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));updateHeader();render();
})();
</script></body></html>
