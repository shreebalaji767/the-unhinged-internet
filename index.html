<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171923"><meta name="description" content="Explore a fictional internet full of games, strange websites, suspicious organizations and questionable decisions.">
<title>The Unhinged Internet</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#11131b;--panel:#1b1f2b;--panel2:#242a39;--ink:#f4f1e8;--muted:#a8afc0;--line:#353d50;--accent:#c7ff65;--pink:#ff83bd;--blue:#82cfff;--yellow:#ffd36e;--shadow:0 16px 40px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#30324c 0,transparent 38%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);background:#171b27eF;padding:14px 18px;border-radius:18px;position:sticky;top:10px;z-index:10;backdrop-filter:blur(16px);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.5px}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--accent);color:#151820;border-radius:13px;font-size:24px}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:0;font-size:11px}.stats{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--panel);padding:7px 11px;border-radius:999px;font-size:12px}.nav{display:flex;gap:7px;overflow:auto;padding:14px 2px}.nav button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:11px;white-space:nowrap}.nav button.active,.btn.primary{background:var(--accent);color:#161a20;border-color:var(--accent);font-weight:800}.btn:hover,.nav button:hover{transform:translateY(-1px);border-color:var(--accent)}main{min-height:70vh}.hero{padding:42px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(115deg,#292f45,#1b2030 58%,#35304a);position:relative;overflow:hidden}.hero:after{content:"✳";position:absolute;font-size:220px;right:4%;top:-65px;color:#ffffff0b;transform:rotate(18deg)}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,68px);line-height:.98;max-width:780px;letter-spacing:-3px;margin:12px 0}.hero p{color:#c6ccda;max-width:660px;font-size:17px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 2px 13px}.sectionhead h2{margin:0;font-size:22px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),#181c27);border-radius:17px;padding:17px;min-width:0;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#77849d}.card .emoji{font-size:32px}.card h3{margin:8px 0 4px}.card p{color:var(--muted);font-size:13px;margin:0 0 14px}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}.pagehead{padding:25px 0 18px}.pagehead h1{font-size:clamp(30px,5vw,48px);margin:4px 0;letter-spacing:-1.8px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:14px}.box{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:18px}.box h2,.box h3{margin-top:0}.choice{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#222838;color:var(--ink)}.choice:hover{border-color:var(--accent);background:#2b3445}.choice:disabled{opacity:.5;cursor:default}.feeditem{border-bottom:1px solid var(--line);padding:13px 0}.feeditem:last-child{border:0}.feeditem strong{display:block}.feeditem p{margin:5px 0;color:var(--muted)}.bar{height:8px;border-radius:99px;background:#333b4e;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.profile{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:15px;background:var(--pink);display:grid;place-items:center;font-size:25px}.field{width:100%;padding:11px;border:1px solid var(--line);background:#111722;color:var(--ink);border-radius:10px;margin:6px 0 12px}.retro{font-family:Tahoma,Verdana,sans-serif;background:#c0c0c0;color:#111;border:2px outset #fff;border-radius:2px;padding:4px}.retro .windowbar{background:linear-gradient(90deg,#000080,#1084d0);color:white;padding:7px;font-weight:bold}.retro .inner{padding:13px;color:#111}.retro button{background:#c0c0c0;color:#111;border:2px outset white;border-radius:2px;padding:7px}.retro a{color:#00e;text-decoration:underline}.notice{border-left:3px solid var(--yellow);padding:10px 13px;background:#ffd36e12;color:#e8d7ac;border-radius:0 9px 9px 0;font-size:13px}.footer{border-top:1px solid var(--line);margin-top:45px;padding:20px 0;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#141820;padding:10px 16px;border-radius:12px;font-weight:800;box-shadow:var(--shadow);z-index:30}.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.top{position:static}}@media(max-width:540px){.shell{padding:10px}.hero{padding:27px 19px}.hero h1{letter-spacing:-1.8px}.grid{grid-template-columns:1fr}.stats{width:100%}.brand{flex:1}.nav{margin:0 -2px}.card{padding:15px}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand"><div class="logo">✳</div><div>THE UNHINGED INTERNET<small>THE INTERNET IS A QUESTIONABLE PLACE</small></div></div><div class="stats"><span class="chip">👤 <b id="topName">Guest NPC</b></span><span class="chip">🪙 <b id="topCoins">100</b> NC</span><span class="chip">🏆 <b id="topLevel">Level 1</b></span></div></header>
<nav class="nav" id="nav"></nav><main id="app" aria-live="polite"></main>
<footer class="footer">THE UNHINGED INTERNET · A fictional universe built for entertainment. Your progress is stored locally in this browser. <span style="float:right">v0.1 · absolutely unofficial</span></footer>
</div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const defaults={name:'Guest NPC',coins:100,xp:0,day:1,location:'Village Square',mood:50,reputation:0,inventory:['One suspicious potato'],posts:[],achievements:[],visited:[],flags:{},job:'Professional Loiterer'};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem('unhinged-save')||'{}')};}catch{state={...defaults};}
state.flags=state.flags&&typeof state.flags==='object'?state.flags:{};state.stats={conversations:0,posts:0,permits:0,workShifts:0,sitesVisited:[],...(state.stats||{})};state.stats.sitesVisited=Array.isArray(state.stats.sitesVisited)?state.stats.sitesVisited:[];state.claimedQuests=Array.isArray(state.claimedQuests)?state.claimedQuests:[];
const save=()=>{localStorage.setItem('unhinged-save',JSON.stringify(state));updateHeader()};
const updateHeader=()=>{$('#topName').textContent=state.name;$('#topCoins').textContent=state.coins;$('#topLevel').textContent='Level '+(1+Math.floor(state.xp/100))};
const toast=msg=>{let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2100)};
const earn=(coins,xp=5)=>{state.coins=Math.max(0,state.coins+coins);state.xp+=xp;save()};
const award=id=>{if(!state.achievements.includes(id)){state.achievements.push(id);toast('🏆 Achievement unlocked: '+id);save()}};
const navItems=[['home','🏠 Home'],['explore','🧭 Explore'],['world','🌐 World'],['quests','📜 Quests'],['npc','🧍 NPC Life'],['pigeon','🐦 PigeonBook'],['ministry','🏛️ Ministry'],['browser','🖥️ Fake Internet'],['profile','👤 My Profile']];
function go(route){location.hash=route}
function shellNav(route){$('#nav').innerHTML=navItems.map(([r,l])=>'<button class="'+(route===r?'active':'')+'" data-go="'+r+'">'+l+'</button>').join('');$('#nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
const card=(emoji,title,desc,route,tag='WEBSITE')=>'<article class="card"><div class="emoji">'+emoji+'</div><div class="tag">'+tag+'</div><h3>'+title+'</h3><p>'+desc+'</p><div class="cardfoot"><span class="muted">Explore this corner</span><button class="btn" data-go="'+route+'">Enter ↗</button></div></article>';
function home(){return '<section class="hero"><div class="eyebrow">WELCOME TO THE OTHER INTERNET</div><h1>A whole internet.<br>A terrible idea.</h1><p>Explore suspicious websites, meet deeply unqualified characters, obtain questionable employment and accidentally become a legend. Nothing here is important. Everything is connected.</p><div class="actions"><button class="btn primary" data-go="explore">Explore the internet →</button><button class="btn" data-go="npc">Start an NPC life</button></div></section><div class="sectionhead"><div><div class="eyebrow">PICK A PORTAL</div><h2>Popular destinations</h2></div><span class="muted">No useful information guaranteed</span></div><div class="grid">'+card('🧍','NPC Life','A hero needs directions. You need a pension.','npc','PLAYABLE SIMULATOR')+card('🐦','PigeonBook','The social network where bread is currency.','pigeon','SOCIAL NETWORK')+card('🏛️','Ministry of Useless Affairs','Apply for permits nobody should need.','ministry','GOVERNMENT')+card('🖥️','Fake Internet 1999','Browse a tiny collection of questionable old sites.','browser','RETRO BROWSER')+card('🧪','Department of Bad Ideas','Coming soon: submit your worst idea.','explore','COMING SOON')+card('👻','The Forgotten Server','A mysterious directory with missing pages.','explore','MYSTERY')+'</div><div class="sectionhead"><h2>📡 Latest universe bulletin</h2></div><div class="box"><b>BREAKING:</b> Local potato has refused to cooperate with authorities. Ministry officials say the potato is “acting like a potato.”</div>'}
const districts=[['🎮','Gaming District','Games, quests and simulators.','npc'],['📱','Social District','Networks, arguments and pigeon influencers.','pigeon'],['🏛️','Government District','Permits, departments and official confusion.','ministry'],['💾','Technology District','Retro browsers and simulated computer oddities.','browser'],['👁️','Mystery District','Lost websites, strange clues and secrets.','browser'],['🤡','Nonsense District','Tools that solve problems nobody has.','explore']];
function explore(){return '<div class="pagehead"><div class="eyebrow">THE DIRECTORY</div><h1>Explore the internet</h1><p class="muted">Six districts. Several questionable life choices.</p></div><div class="grid">'+districts.map(d=>card(...d,'DISTRICT')).join('')+'</div><div class="sectionhead"><h2>Coming to this universe</h2></div><div class="grid">'+[['🥔','War of the Potatoes'],['🏢','Office of Useless Affairs'],['🛒','Useless Shopping Mall'],['👽','Alien Customer Service'],['🧦','National Sock Investigation'],['🕳️','Digital Backrooms']].map(x=>card(x[0],x[1],'This portal is on the development list.','explore','COMING SOON')).join('')+'</div>'}
const npcLines=[
['A hero approaches you.','“Excuse me, do you know where the Dragon Cave is?”',['I have no idea. I live here.','Have you tried turning left?','I used to be an adventurer like you...','Buy my suspicious potato.','...'],['“That is concerning.” The hero walks away.','“There is no left.” You both stare at a map.','The hero asks you not to finish that sentence.','The potato glows. The hero pays you 15 coins.','You stare into the middle distance.']],
['The village baker looks exhausted.','“Can you watch the shop for five minutes?”',['Absolutely. I am trustworthy.','I will eat the evidence.','What is the salary?','I am actually a dragon.','Pretend I was never here.'],['You are promoted to temporary bread supervisor.','Three loaves disappear. Nobody can prove anything.','The baker offers 8 coins.','The baker looks at you. “No, you are not.”','The baker leaves. You guard an empty chair.']],
['A guard blocks the road.','“State your business.”',['I am just standing here.','Official potato inspector.','I forgot.','I demand a tiny hat.','Can I interest you in a potato?'],['The guard nods. Standing is permitted.','The guard requests your imaginary badge.','The guard respects your honesty.','The guard gives you a tiny hat.','The guard buys the potato for 10 coins.']]
];
function npc(){let idx=state.flags.npcScene||0;let scene=npcLines[idx%npcLines.length];return '<div class="pagehead"><div class="eyebrow">GAMING DISTRICT / LIFE SIMULATOR</div><h1>NPC Life</h1><p class="muted">Day '+state.day+' · '+state.location+' · Job: '+state.job+'</p></div><div class="layout"><section class="box"><div style="font-size:46px">🧍‍♂️　🧙</div><div class="tag">RANDOM ENCOUNTER</div><h2>'+scene[0]+'</h2><p>'+scene[1]+'</p><h3>Choose your dialogue</h3>'+scene[2].map((x,i)=>'<button class="choice" data-dialog="'+i+'">'+(i+1)+'. '+x+'</button>').join('')+'<div id="npcResult" class="notice hidden"></div><div class="actions"><button class="btn" data-action="work">Do a questionable shift (+12 NC)</button><button class="btn" data-action="sleep">Go home / next day</button></div></section><aside class="box"><h3>📋 NPC status</h3><p>Mood</p><div class="bar"><span style="width:'+state.mood+'%"></span></div><p>Reputation: <b>'+state.reputation+'</b></p><p>Coins: <b>'+state.coins+' NC</b></p><p>Inventory</p><ul>'+state.inventory.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="notice">Local prophecy: You are not the chosen one. You are barely the backup one.</div></aside></div>'}
function npcChoice(i){let scene=npcLines[state.flags.npcScene||0%npcLines.length];let idx=(state.flags.npcScene||0)%npcLines.length;scene=npcLines[idx];let result=scene[3][i];let reward=[2,1,0,15,0][i];if(idx===1)reward=[0,-2,8,0,0][i];if(idx===2)reward=[0,0,2,0,10][i];state.coins=Math.max(0,state.coins+reward);state.xp+=8;state.stats.conversations++;state.reputation+=i===3?1:0;state.mood=Math.max(5,Math.min(100,state.mood+(i===4?-3:2)));state.flags.npcScene=idx+1;state.flags.npcResult=result;save();award('First Conversation');render()}
function pigeon(){let posts=state.posts.length?state.posts:[{by:'Mayor Pigeon',txt:'URGENT: Bread prices are up 400%. This is a dark day for beak-kind.',likes:12},{by:'DefinitelyNotARat',txt:'Hello fellow pigeons. I enjoy seeds and definitely do not operate a cheese-based intelligence network.',likes:4},{by:'BreadEnjoyer99',txt:'just dropped a crumb. biggest day of my life.',likes:28}];return '<div class="pagehead"><div class="eyebrow">SOCIAL DISTRICT</div><h1>🐦 PigeonBook</h1><p class="muted">Connect. Squawk. Demand bread.</p></div><div class="layout"><section class="box"><h2>Public flock feed</h2><label for="postText">Broadcast a thought to the flock</label><textarea id="postText" class="field" rows="3" maxlength="180" placeholder="The bread economy is collapsing..."></textarea><button class="btn primary" data-action="post">Publish squawk</button>'+posts.slice().reverse().map(p=>'<div class="feeditem"><strong>🐦 '+escapeHTML(p.by)+'</strong><p>'+escapeHTML(p.txt)+'</p><span class="muted">❤️ '+p.likes+' crumbs of approval</span></div>').join('')+'</section><aside class="box"><h3>Flock trends</h3><p>#BreadGate</p><p>#SuspiciousHumans</p><p>#PigeonInflation</p><div class="notice">This is a fictional local feed. Your posts stay in this browser.</div></aside></div>'}
function ministry(){return '<div class="pagehead"><div class="eyebrow">GOVERNMENT DISTRICT</div><h1>Ministry of Useless Affairs</h1><p class="muted">Officially unofficial since yesterday.</p></div><div class="retro"><div class="windowbar">Ministry Portal — Citizen Services</div><div class="inner"><h2>Welcome, citizen '+escapeHTML(state.name)+'.</h2><p>Choose a service. Processing may take between 3 seconds and 400 fictional years.</p><div class="grid">'+[['🪪','NPC Identity Card','identity'],['🥔','Potato Ownership Permit','potato'],['🧦','Missing Sock Investigation','sock'],['🧍','Standing Around License','stand']].map(x=>'<div class="card" style="background:#ddd;color:#111;border-color:#777"><h3>'+x[0]+' '+x[1]+'</h3><p style="color:#333">Application fee: 5 NC</p><button data-permit="'+x[2]+'">Apply for permit</button></div>').join('')+'</div><p id="permitResult" aria-live="polite"></p><hr><small>Ministry disclaimer: This institution has no legal authority, budget, building or staff who know what is happening.</small></div></div>'}
function browser(){return '<div class="pagehead"><div class="eyebrow">TECHNOLOGY DISTRICT</div><h1>Fake Internet 1999</h1><p class="muted">A browser inside a browser. The future was a mistake.</p></div><div class="retro"><div class="windowbar">Netscape-ish Navigator — Totally Real Internet</div><div class="inner"><div style="display:flex;gap:7px;flex-wrap:wrap"><button data-site="portal">Home</button><button data-site="webring">Web ring</button><button data-site="conspiracy">Conspiracy page</button><button data-site="guestbook">Guestbook</button></div><hr><div id="fakeSite"><h2>Welcome to my homepage!!!</h2><p>✨ YOU ARE VISITOR NUMBER 0000'+(100+state.xp)+' ✨</p><p>Best viewed at 800 × 600. Please sign my guestbook. I made this page during computer class.</p><p><blink>UNDER CONSTRUCTION!!!</blink></p><button data-site="guestbook">Sign guestbook</button></div></div></div><p class="muted">These are simulated pages. External links are intentionally disabled.</p>'}
function profile(){return '<div class="pagehead"><div class="eyebrow">YOUR UNIVERSAL ACCOUNT</div><h1>Player profile</h1><p class="muted">One identity. Several questionable decisions.</p></div><div class="layout"><section class="box"><div class="profile"><div class="avatar">🧑</div><div><h2 style="margin:0">'+escapeHTML(state.name)+'</h2><span class="muted">'+escapeHTML(state.job)+'</span></div></div><label>Display name</label><input class="field" id="nameInput" maxlength="24" value="'+escapeAttr(state.name)+'"><button class="btn primary" data-action="rename">Save identity</button><hr><div class="grid"><div><div class="tag">WALLET</div><h2>🪙 '+state.coins+' NC</h2></div><div><div class="tag">EXPERIENCE</div><h2>⭐ '+state.xp+'</h2></div><div><div class="tag">REPUTATION</div><h2>📣 '+state.reputation+'</h2></div></div><h3>Achievements</h3>'+(state.achievements.length?state.achievements.map(x=>'<p>🏆 '+escapeHTML(x)+'</p>').join(''):'<p class="muted">No achievements yet. Go do something mildly memorable.</p>')+'</section><aside class="box"><h3>🎒 Inventory</h3><ul>'+state.inventory.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul><button class="btn" data-action="backup">Export save file</button><button class="btn" data-action="reset">Reset universe</button><p class="muted">Your save is stored only in this browser.</p></aside></div>'}

const questDefs=[
{id:'first-contact',title:'Talk to a Local',desc:'Have your first NPC conversation.',stat:'conversations',target:1,reward:20,xp:10},
{id:'social-butterfly',title:'Broadcast to the Flock',desc:'Publish a post on PigeonBook.',stat:'posts',target:1,reward:15,xp:10},
{id:'paper-trail',title:'A Mountain of Paperwork',desc:'Collect two official permits.',stat:'permits',target:2,reward:30,xp:15},
{id:'honest-labor',title:'Questionable Employment',desc:'Complete three questionable work shifts.',stat:'workShifts',target:3,reward:35,xp:20},
{id:'internet-tourist',title:'Lost in the Internet',desc:'Visit four different destinations.',stat:'sitesVisited',target:4,reward:25,xp:15}
];
const worldEvents=[
{title:'Pigeon Parade',icon:'🐦',desc:'The flock is celebrating. Publish a squawk and collect a parade ribbon.',item:'Parade Ribbon'},
{title:'Potato Appreciation Day',icon:'🥔',desc:'Potatoes are national treasures today. The Ministry is handing out honorary spud badges.',item:'Honorary Spud Badge'},
{title:'Suspiciously Productive Tuesday',icon:'🧰',desc:'The village needs workers. Complete a shift and receive a tiny hard hat.',item:'Tiny Hard Hat'},
{title:'Retro Web Revival',icon:'💾',desc:'The old internet is back. Visit the Fake Internet and receive a floppy disk.',item:'Mystery Floppy Disk'}
];
function questProgress(q){return q.stat==='sitesVisited'?state.stats.sitesVisited.length:Number(state.stats[q.stat]||0)}
function quests(){return '<div class="pagehead"><div class="eyebrow">SHARED UNIVERSE / QUEST LOG</div><h1>📜 Quest Board</h1><p class="muted">Your actions in different websites now count toward the same adventures.</p></div><div class="grid">'+questDefs.map(q=>{let n=questProgress(q),done=n>=q.target,claimed=state.claimedQuests.includes(q.id);return '<article class="card"><div class="tag">'+(claimed?'COMPLETED':done?'READY TO CLAIM':'IN PROGRESS')+'</div><h3>'+q.title+'</h3><p>'+q.desc+'</p><div class="bar"><span style="width:'+Math.min(100,n/q.target*100)+'%"></span></div><p>'+Math.min(n,q.target)+' / '+q.target+' · Reward: 🪙 '+q.reward+' NC + '+q.xp+' XP</p><div class="cardfoot"><span class="muted">'+(claimed?'Reward collected':done?'Quest complete':'Keep exploring')+'</span><button class="btn '+(done&&!claimed?'primary':'')+'" data-claim-quest="'+q.id+'" '+(!done||claimed?'disabled':'')+'>'+(claimed?'Claimed':done?'Claim reward':'Locked')+'</button></div></article>'}).join('')+'</div><div class="sectionhead"><h2>How progress works</h2></div><div class="box"><p>Talk to NPCs, publish PigeonBook posts, collect Ministry permits, work shifts, and visit different destinations. Your existing save is upgraded automatically; no reset is needed.</p></div>'}
function world(){let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];let claimed=state.flags.eventClaimedDay===state.day;return '<div class="pagehead"><div class="eyebrow">THE SHARED UNIVERSE</div><h1>🌐 World Hub</h1><p class="muted">One world state connects the websites, characters, currency and your adventures.</p></div><div class="layout"><section class="box"><div class="tag">TODAY\'S WORLD EVENT · DAY '+state.day+'</div><h2>'+event.icon+' '+event.title+'</h2><p>'+event.desc+'</p><button class="btn primary" data-world-event '+(claimed?'disabled':'')+'>'+(claimed?'Event reward collected':'Investigate event')+'</button><p class="muted">'+(claimed?'You already investigated today. Sleep in NPC Life to advance the day.':'One event reward is available per in-game day.')+'</p></section><aside class="box"><h3>🗺️ World status</h3><p>Destinations visited: <b>'+state.stats.sitesVisited.length+'</b></p><p>NPC conversations: <b>'+state.stats.conversations+'</b></p><p>Public squawks: <b>'+state.stats.posts+'</b></p><p>Permits collected: <b>'+state.stats.permits+'</b></p><p>Work shifts: <b>'+state.stats.workShifts+'</b></p><button class="btn" data-go="quests">Open quest board →</button></aside></div><div class="sectionhead"><h2>People you may encounter</h2></div><div class="grid">'+[['🧙','The Lost Hero','Needs directions. Has no map.'],['🥖','Martha the Baker','Runs the village bakery and pays badly.'],['🛡️','Gate Guard Greg','Protects the road from suspicious potatoes.'],['🐦','Mayor Pigeon','Elected by a landslide of crumbs.']].map(n=>'<article class="card"><div class="emoji">'+n[0]+'</div><h3>'+n[1]+'</h3><p>'+n[2]+'</p></article>').join('')+'</div><div class="sectionhead"><h2>Shared world rules</h2></div><div class="box"><p>Coins, XP, inventory, achievements, NPC encounters, social posts, permits and quest progress all belong to the same local player save. This is a single-player simulated world; it does not create real online multiplayer or cross-device sync.</p></div>'}
function claimQuest(id){let q=questDefs.find(x=>x.id===id);if(!q||state.claimedQuests.includes(id)||questProgress(q)<q.target)return;state.claimedQuests.push(id);state.coins+=q.reward;state.xp+=q.xp;award('Quest: '+q.title);save();toast('Quest reward collected!');render()}
function claimWorldEvent(){if(state.flags.eventClaimedDay===state.day)return;let event=worldEvents[(Math.max(1,state.day)-1)%worldEvents.length];state.flags.eventClaimedDay=state.day;state.coins+=10;state.xp+=10;state.inventory.push(event.item);save();award('World Event Explorer');toast('Event reward: '+event.item);render()}

function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHTML(s)}
const pages={home,explore,world,quests,npc,pigeon,ministry,browser,profile};
function render(){let route=(location.hash.slice(1)||'home').split('/')[0];if(!pages[route])route='home';if(!state.stats.sitesVisited.includes(route)){state.stats.sitesVisited.push(route);save()}shellNav(route);$('#app').innerHTML=pages[route]();$('#app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#app').querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>npcChoice(Number(b.dataset.dialog)));$('#app').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));$('#app').querySelectorAll('[data-permit]').forEach(b=>b.onclick=()=>permit(b.dataset.permit));$('#app').querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>fakeSite(b.dataset.site));$('#app').querySelectorAll('[data-claim-quest]').forEach(b=>b.onclick=()=>claimQuest(b.dataset.claimQuest));$('#app').querySelectorAll('[data-world-event]').forEach(b=>b.onclick=claimWorldEvent);}
function action(a){if(a==='work'){state.stats.workShifts++;earn(12,10);toast('Shift complete. You earned 12 NC.');render()}if(a==='sleep'){state.day++;state.mood=Math.min(100,state.mood+15);state.location='Village Square';save();toast('A new day begins. Nothing has changed.');render()}if(a==='post'){let txt=$('#postText').value.trim();if(!txt)return toast('You cannot publish an empty squawk.');state.posts.push({by:state.name,txt,likes:0});state.stats.posts++;earn(1,2);award('First Public Squawk');render();toast('Your squawk has entered the ecosystem.')}if(a==='rename'){let n=$('#nameInput').value.trim();if(!n)return toast('A name is required.');state.name=n;save();render();toast('Identity updated. The government is confused.')}if(a==='backup'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='unhinged-internet-save.json';a.click();URL.revokeObjectURL(url)}if(a==='reset'){if(confirm('Reset all local universe progress? Export a backup first if you want to keep it.')){localStorage.removeItem('unhinged-save');state={...defaults};save();go('home')}}}
function permit(id){let labels={identity:'NPC Identity Card',potato:'Potato Ownership Permit',sock:'Missing Sock Investigation',stand:'Standing Around License'};if(state.coins<5){$('#permitResult').textContent='APPLICATION REJECTED: insufficient nonsense coins.';return}state.coins-=5;state.inventory.push(labels[id]);state.stats.permits++;state.xp+=5;save();$('#permitResult').textContent='APPROVED: '+labels[id]+' issued. Please display it to absolutely nobody.';award('Licensed Citizen')}
function fakeSite(site){let copy={portal:'<h2>Welcome to my homepage!!!</h2><p>✨ Visitor '+(100+state.xp)+' ✨</p><p>UNDER CONSTRUCTION. Always.</p>',webring:'<h2>THE POTATO WEBRING</h2><p>Previous site ← You are here → Next site</p><p>Only 3 websites are in this webring. One is missing.</p>',conspiracy:'<h2>THE MOON IS A POTATO?</h2><p>Evidence: it is round. Potatoes are round. Wake up, villagers.</p><p>Last updated: 03/14/1999</p>',guestbook:'<h2>GUESTBOOK</h2><p>“Cool page!!!” — Anonymous</p><p>“Please stop emailing me.” — Webmaster</p><p>“I was here.” — You, probably</p>'};$('#fakeSite').innerHTML=copy[site]||copy.portal;earn(0,1)}
