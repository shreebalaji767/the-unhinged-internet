    <path d="M64 17 C42 17 25 34 25 55 C25 76 40 92 59 95 C77 98 94 85 98 67 C102 50 91 34 76 29 C61 24 45 32 41 46 C37 59 45 72 57 76" stroke="url(#swirl2)" stroke-width="2.6"/>
    <path d="M64 26 C84 26 101 42 101 62 C101 82 85 98 66 100 C47 102 31 88 29 70 C27 53 39 38 55 35 C70 32 84 42 87 56 C90 70 81 82 69 85" stroke="url(#swirl)" stroke-width="2.5"/>
    <path d="M64 40 C77 40 88 50 88 63 C88 76 78 87 65 88 C53 89 42 80 41 68 C40 57 48 48 58 47" stroke="url(#swirl2)" stroke-width="2.3"/>
  </g>
  <path d="M64 43 C67 55 72 60 84 64 C72 68 67 73 64 85 C61 73 56 68 44 64 C56 60 61 55 64 43Z" fill="#fff8ef" filter="url(#neon)"/>
</svg>