<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">The Unhinged Internet</title>
  <desc id="desc">A luminous cyan, violet and magenta swirling portal with a white star at its centre, on a transparent background.</desc>
  <defs>
    <linearGradient id="swirl" x1="18" y1="38" x2="111" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20f4f2"/>
      <stop offset=".48" stop-color="#8b59ff"/>
      <stop offset="1" stop-color="#ff43cb"/>
    </linearGradient>
    <linearGradient id="swirl2" x1="28" y1="25" x2="99" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27e9f4"/>
      <stop offset=".55" stop-color="#a34dff"/>
      <stop offset="1" stop-color="#ff54c9"/>
    </linearGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
